<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPR 三维体渲染查看器</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                 font-family: system-ui, "Microsoft YaHei", sans-serif; background: #111; color: #ddd; }
    #app { position: fixed; inset: 0; display: flex; }
    #viewport { flex: 1; position: relative; }
    #viewport canvas { display: block; width: 100%; height: 100%; }

    /* 面板 */
    .panel { background: rgba(20, 20, 24, 0.92); border: 1px solid #333; border-radius: 8px;
             padding: 10px 12px; font-size: 12px; }
    .panel h3 { margin: 0 0 8px; font-size: 12px; color: #8ab4ff; }
    .panel label { display: flex; align-items: center; justify-content: space-between;
                   gap: 8px; margin: 4px 0; }
    .panel input[type=range] { flex: 1; min-width: 90px; }
    .panel select { width: 100%; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
    .panel .val { width: 56px; text-align: right; color: #9cd; font-variant-numeric: tabular-nums; }

    #stylePanel { position: absolute; top: 10px; right: 10px; width: 210px; }
    /* 测线可见性面板（多线模式用；单线模式隐藏） */
    #linePanel { position: absolute; top: 330px; right: 10px; width: 210px;
                 max-height: 42vh; overflow-y: auto; display: none; }
    #lineList { display: flex; flex-direction: column; gap: 3px; }
    #lineList label { display: flex; align-items: center; gap: 6px; font-size: 11px;
                      justify-content: flex-start; margin: 0; }
    #lineList .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    #lineList input[type=checkbox] { flex: none; }
    #lineList .lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #mapPanel   { position: absolute; bottom: 10px; right: 10px; width: 240px; height: 212px;
                  display: flex; flex-direction: column; gap: 4px; }
    #mapPanel canvas { flex: 1; width: 100%; background: #0d1117; border-radius: 4px; }
    /* 跨轨放大滑块（多线模式显示；单线隐藏） */
    #gpsZoomWrap { display: none; margin: 2px 0 0; }
    /* 视口右下角坐标轴方向指示器（mapPanel 上方，点击平面切换前/俯/左视图） */
    #viewCube { position: absolute; right: 12px; bottom: 234px; width: 108px; height: 108px;
                background: rgba(15,17,22,0.72); border: 1px solid #333; border-radius: 8px;
                cursor: pointer; user-select: none; overflow: hidden; }
    #viewCube canvas { width: 100%; height: 100%; display: block; }
    #slicePanel { position: absolute; bottom: 10px; left: 10px; width: 660px; height: 400px;
                  display: flex; flex-direction: column; gap: 6px; }
    #slicePanel .slice-controls { display: flex; gap: 14px; align-items: center; font-size: 11px; }
    #slicePanel .slice-controls label { display: flex; align-items: center; gap: 6px; margin: 0; }
    #slicePanel .slice-controls input[type=range] { width: 90px; flex: none; }
    /* B-Scan/C-Scan 各自独占一行（全宽），雷达图 X 沿轨方向需要横向空间 */
    #slicePanel .slice-row { flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    #slicePanel .slice { flex: 1; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
    #slicePanel .slice .cap { font-size: 10px; color: #8ab4ff; text-align: center;
                              white-space: nowrap; overflow: hidden; }
    #slicePanel canvas { flex: 1; min-height: 0; width: 100%; background: #000; image-rendering: pixelated; }
    #hud { position: absolute; top: 10px; left: 10px; color: #bbb; font-size: 11px;
           background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
    #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
              color: #aaa; font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px 12px;
              border-radius: 12px; pointer-events: none; }

    /* === T5+ 专业面板骨架 === */
    #sideBar  { position: absolute; top: 10px; left: 10px; width: 220px; max-height: calc(100vh - 20px);
                display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    .row .swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; border: 1px solid #00000040; }
    .row .label  { flex: 1; font-size: 11px; }
    .row .del    { background: transparent; color: #e57373; border: 0; cursor: pointer; font-size: 14px; }
    #layerPanel     { background: rgba(20,20,24,0.92); border:1px solid #333; border-radius:8px; padding: 8px 10px; }
    #boreholePanel  { background: rgba(20,20,24,0.92); border:1px solid #333; border-radius:8px; padding: 8px 10px; max-height: 36vh; overflow-y: auto; }
    #boreholePanel .bh-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 11px; }
    #boreholePanel .bh-row input[type=checkbox] { flex: none; }
    #boreholePanel .bh-id { flex: none; color: #8ab4ff; }
    #boreholePanel .bh-sec { margin-left: auto; background: #2a3a55; color: #cce; border: 0; border-radius: 3px; padding: 1px 6px; font-size: 10px; cursor: pointer; }
    #sourcePanel { background: rgba(20,20,24,0.92); border:1px solid #333; border-radius:8px; padding: 8px 10px; }
    #sourcePanel .src-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 11px; }
    #sourcePanel select { background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 1px 4px; }
    #sectionWindow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                     width: 540px; max-height: 70vh; overflow-y: auto;
                     background: rgba(15,17,22,0.95); border: 1px solid #4d9fff; border-radius: 10px;
                     padding: 14px 16px; display: none; z-index: 50; }
    #sectionWindow.open { display: block; }
    #sectionWindow .x { float: right; cursor: pointer; color: #e57373; font-size: 16px; }
    #dropHint { position: absolute; inset: 0; background: rgba(77,159,255,0.18);
                border: 3px dashed #4d9fff; display: none; align-items: center; justify-content: center;
                color: #fff; font-size: 18px; pointer-events: none; z-index: 100; }
    #dropHint.on { display: flex; }
    #measureHud { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
                  color: #fff; font-size: 12px; background: rgba(0,0,0,0.6);
                  padding: 4px 12px; border-radius: 12px; pointer-events: none; display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport">
      <div id="viewCube" title="点击平面切换视图（前/俯/左）"></div>
    </div>
    <div id="hud"></div>
    <div id="status">加载中…</div>
    <div id="sideBar">
      <div id="sourcePanel" class="panel"></div>
      <div id="layerPanel"   class="panel"></div>
      <div id="boreholePanel" class="panel"></div>
    </div>
    <div id="stylePanel" class="panel"></div>
    <div id="linePanel" class="panel"><h3>测线可见性</h3><div id="lineList"></div></div>
    <div id="mapPanel" class="panel"><h3>UTM 轨迹</h3>
      <label id="gpsZoomWrap" title="跨轨放大倍数（0=自动，>0=固定倍数）">跨轨放大
        <input type="range" id="gpsZoomSlider" min="0" max="100" step="1" value="0">
        <span class="val" id="gpsZoomVal">自动</span>
      </label>
    </div>
    <div id="slicePanel" class="panel">
      <div class="slice-controls">
        <label>测线 <select id="lineSelect" title="B-Scan 数据源"></select></label>
        <label>C-Scan <select id="cscanMode">
          <option value="single">单线</option>
          <option value="composite">全宽合成</option>
        </select></label>
        <label>通道 <input type="range" id="chanSlider" min="0" max="13" value="0"></label>
        <label>深度 <input type="range" id="depthSlider" min="0" max="0" value="0"></label>
      </div>
      <div class="slice-row">
        <div class="slice"><div class="cap" id="bscanCap">B-Scan 通道 0</div><canvas id="bscanCanvas"></canvas></div>
        <div class="slice"><div class="cap" id="cscanCap">C-Scan 深度 0</div><canvas id="cscanCanvas"></canvas></div>
      </div>
    </div>
    <div id="sectionWindow"></div>
    <div id="dropHint">拖入 CSV / DXF 文件到此处</div>
    <div id="measureHud"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
