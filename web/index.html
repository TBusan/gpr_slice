<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPR 三维体渲染查看器</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                 font-family: system-ui, "Microsoft YaHei", sans-serif; background: #111; color: #ddd; }
    #app { position: fixed; inset: 0; display: flex; }
    #viewport { flex: 1; position: relative; }
    #viewport canvas { display: block; width: 100%; height: 100%; }

    /* 面板 */
    .panel { background: rgba(20, 20, 24, 0.92); border: 1px solid #333; border-radius: 8px;
             padding: 10px 12px; font-size: 12px; }
    .panel h3 { margin: 0 0 8px; font-size: 12px; color: #8ab4ff; }
    .panel label { display: flex; align-items: center; justify-content: space-between;
                   gap: 8px; margin: 4px 0; }
    .panel input[type=range] { flex: 1; min-width: 90px; }
    .panel select { width: 100%; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
    .panel .val { width: 56px; text-align: right; color: #9cd; font-variant-numeric: tabular-nums; }

    #stylePanel { position: absolute; top: 10px; right: 10px; width: 210px; }
    #mapPanel   { position: absolute; bottom: 10px; right: 10px; width: 240px; height: 190px;
                  display: flex; flex-direction: column; gap: 4px; }
    #mapPanel canvas { flex: 1; width: 100%; background: #0d1117; border-radius: 4px; }
    #slicePanel { position: absolute; bottom: 10px; left: 10px; width: 430px; height: 205px;
                  display: flex; flex-direction: column; gap: 6px; }
    #slicePanel .slice-controls { display: flex; gap: 14px; align-items: center; font-size: 11px; }
    #slicePanel .slice-controls label { display: flex; align-items: center; gap: 6px; margin: 0; }
    #slicePanel .slice-controls input[type=range] { width: 90px; flex: none; }
    #slicePanel .slice-row { flex: 1; display: flex; gap: 8px; min-height: 0; }
    #slicePanel .slice { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    #slicePanel .slice .cap { font-size: 10px; color: #8ab4ff; text-align: center;
                              white-space: nowrap; overflow: hidden; }
    #slicePanel canvas { width: 100%; height: 100%; background: #000; image-rendering: pixelated; }
    #hud { position: absolute; top: 10px; left: 10px; color: #bbb; font-size: 11px;
           background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px; pointer-events: none; }
    #status { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
              color: #aaa; font-size: 12px; background: rgba(0,0,0,0.5); padding: 4px 12px;
              border-radius: 12px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>
    <div id="hud"></div>
    <div id="status">加载中…</div>
    <div id="stylePanel" class="panel"></div>
    <div id="mapPanel" class="panel"><h3>UTM 轨迹</h3></div>
    <div id="slicePanel" class="panel">
      <div class="slice-controls">
        <label>通道 <input type="range" id="chanSlider" min="0" max="13" value="0"></label>
        <label>深度 <input type="range" id="depthSlider" min="0" max="0" value="0"></label>
      </div>
      <div class="slice-row">
        <div class="slice"><div class="cap" id="bscanCap">B-Scan 通道 0</div><canvas id="bscanCanvas"></canvas></div>
        <div class="slice"><div class="cap" id="cscanCap">C-Scan 深度 0</div><canvas id="cscanCanvas"></canvas></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
